name: Parity

# Baseline capture on Windows. The anonymized fixture is not committed yet
# (decision E2), so the job takes it from an earlier run's artifact and skips
# with a notice when none is named.
on:
  workflow_dispatch:
    inputs:
      fixture_run:
        description: "Run id holding a parity-fixture artifact"
        required: false
        default: ""
      lanes:
        description: "States or groups to capture, or all. perf runs the perf probe only, report T40's Windows report only"
        required: false
        default: "all"
      perf_runs:
        description: "Runs per app for the perf lane"
        required: false
        default: "10"
      golden_run:
        description: "Run id holding a parity-goldens artifact (T05's parity/out/golden), for the Tauri cross-engine lane"
        required: false
        default: ""
  push:
    branches: ["port/**"]
    paths:
      - "parity/**"
      - ".github/workflows/parity.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: parity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parity
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test

  baseline-windows:
    needs: unit
    if: github.event_name == 'push' || (inputs.lanes != 'perf' && !contains(inputs.lanes, 'report'))
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the fixture
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.fixture_run }}
        run: |
          if [ -d parity/snapshots/fixture/data ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name parity-fixture --dir parity/snapshots/fixture
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No fixture. Pass fixture_run with the id of a run that uploaded a parity-fixture artifact. Skipping the Windows baseline."
          fi

      - if: steps.fixture.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.fixture.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - if: steps.fixture.outputs.found == 'true'
        name: Build trunk Electron
        run: |
          npm ci
          npm run rebuild
          node node_modules/electron/install.js
          npm run build

      - if: steps.fixture.outputs.found == 'true'
        name: Install parity
        working-directory: parity
        run: bun install --frozen-lockfile

      - if: steps.fixture.outputs.found == 'true'
        name: Capture twice
        working-directory: parity
        env:
          LANES: ${{ inputs.lanes || 'all' }}
        run: |
          bun capture.ts --app electron --data fixture --states "$LANES" --out out/baseline/run-1
          bun capture.ts --app electron --data fixture --states "$LANES" --out out/baseline/run-2

      - if: steps.fixture.outputs.found == 'true'
        name: Compare the two runs
        working-directory: parity
        run: bun determinism.ts out/baseline/run-1 out/baseline/run-2 | tee out/baseline/determinism.log

      - if: steps.fixture.outputs.found == 'true'
        name: Dump the tray and app menus
        working-directory: parity
        run: bun menus.ts --app electron --data fixture --out out/baseline/menus

      - if: always() && steps.fixture.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parity-baseline-windows
          path: parity/out/baseline

  perf:
    needs: unit
    if: github.event_name == 'workflow_dispatch' && contains(inputs.lanes, 'perf')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the fixture
        id: fixture
        env:
          RUN_ID: ${{ inputs.fixture_run }}
        run: |
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name parity-fixture --dir parity/snapshots/fixture
            echo "data=fixture" >> "$GITHUB_OUTPUT"
          else
            echo "data=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No fixture. The app starts on an empty folder and first content is the page shell, not a Match History row."
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install parity
        working-directory: parity
        run: bun install --frozen-lockfile

      - name: Measure Electron 1.2.1
        working-directory: parity
        env:
          DATA: ${{ steps.fixture.outputs.data }}
          PERF_RUNS: ${{ inputs.perf_runs }}
        run: |
          mkdir -p out
          selector=()
          if [ "$DATA" = none ]; then selector=(--selector main); fi
          bun perf.ts --app electron-1.2.1 --runs "${PERF_RUNS:-10}" --data "$DATA" "${selector[@]}" | tee out/perf-${{ matrix.os }}.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: |
            parity/out/perf/*.json
            parity/out/perf-*.log

  # T07 lane 2 and decision E1: trunk Electron against Electron's own renderer in
  # WebView2, through the Tauri parity driver. It needs the committed fixture, as the
  # baseline job does, and goldens recorded from it, so it skips with a notice until
  # both exist (decision E2).
  cross-engine-windows:
    needs: unit
    if: github.event_name == 'push' || !contains(inputs.lanes, 'report')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the fixture and goldens
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GOLDEN_RUN: ${{ inputs.golden_run }}
        run: |
          if [ ! -f parity/snapshots/fixture/data/matches.db ] || [ -z "$GOLDEN_RUN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The anonymized fixture is not committed, or no golden_run (a parity-goldens artifact) was named (decision E2). Skipping WebView2 against Electron."
            exit 0
          fi
          gh run download "$GOLDEN_RUN" --name parity-goldens --dir parity/out/golden
          echo "found=true" >> "$GITHUB_OUTPUT"

      - if: steps.inputs.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.inputs.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - if: steps.inputs.outputs.found == 'true'
        name: Install the pinned Rust toolchain
        working-directory: tauri
        run: rustup show active-toolchain || rustup toolchain install

      - if: steps.inputs.outputs.found == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - if: steps.inputs.outputs.found == 'true'
        name: Build trunk Electron
        run: |
          npm ci
          npm run rebuild
          node node_modules/electron/install.js
          npm run build

      - if: steps.inputs.outputs.found == 'true'
        name: Build the Tauri driver build
        working-directory: tauri
        run: |
          bun install --frozen-lockfile
          bun run tauri build --debug --no-bundle --features parity-driver

      - if: steps.inputs.outputs.found == 'true'
        name: Install parity
        working-directory: parity
        run: bun install --frozen-lockfile

      - if: steps.inputs.outputs.found == 'true'
        name: Capture Electron, then Tauri twice
        working-directory: parity
        env:
          LANES: ${{ inputs.lanes }}
        run: |
          states="${LANES:-default}"
          bun capture.ts --app electron --data fixture --states "$states" --out out/baseline/electron-win
          bun capture.ts --app tauri --data fixture --states "$states" --out out/baseline/tauri-win --compare out/baseline/electron-win
          bun capture.ts --app tauri --data fixture --states "$states" --out out/baseline/tauri-win-2

      - if: steps.inputs.outputs.found == 'true'
        name: Same-engine numbers, WebView2 against itself and against Electron
        working-directory: parity
        # Both are measurements for decision E1, so a FAIL is recorded, not raised
        run: |
          set +e
          bun determinism.ts out/baseline/tauri-win out/baseline/tauri-win-2 > out/baseline/tauri-repeat.log
          echo "exit $?" >> out/baseline/tauri-repeat.log
          bun determinism.ts out/baseline/electron-win out/baseline/tauri-win > out/baseline/electron-vs-webview2-same-engine.log
          echo "exit $?" >> out/baseline/electron-vs-webview2-same-engine.log
          cat out/baseline/tauri-repeat.log out/baseline/electron-vs-webview2-same-engine.log

      - if: always() && steps.inputs.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parity-cross-engine-windows
          path: parity/out/baseline

  # T40: the parity report on Windows. The same `report.ts run` as on the Mac,
  # trunk Electron against the head Tauri driver build on its own UI and
  # commands, uploading report-win.json for `report.ts render`. It runs on the
  # committed fixture and replays the committed goldens (decision E2).
  report-windows:
    needs: unit
    if: github.event_name == 'workflow_dispatch' && contains(inputs.lanes, 'report')
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install the pinned Rust toolchain
        working-directory: tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build trunk Electron
        run: |
          git fetch --depth 1 origin main
          npm ci
          npm run rebuild
          node node_modules/electron/install.js
          npm run build

      - name: Build the Tauri driver build
        working-directory: tauri
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run tauri build --debug --no-bundle --features parity-driver

      - name: Install parity
        working-directory: parity
        run: bun install --frozen-lockfile

      - name: Run the report
        run: bun parity/report.ts run --data fixture --out parity/out/report --trunk origin/main --golden-dir parity/goldens/data

      # `run` records a failed verdict and exits 0; `check` exits 1 on it, so the job shows it
      - name: Fail the job when the report fails
        run: bun parity/report.ts check parity/out/report/report-win.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-windows
          path: |
            parity/out/report/report-win.json
            parity/out/report/*.log
            parity/out/report/tauri-win/cross-engine
            parity/out/report/tauri-win/*.json
            parity/out/report/electron-win/timing.json
