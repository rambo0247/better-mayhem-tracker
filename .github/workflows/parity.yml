name: Parity

# Baseline capture on Windows. It runs once the anonymized fixture is committed
# under parity/snapshots/fixture (decision E2). Until then the job skips with a
# notice. Nothing publishes the fixture as an artifact.
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "States or groups to capture, or all"
        required: false
        default: "all"
  push:
    branches: ["port/**"]
    paths:
      - "parity/**"
      - ".github/workflows/parity.yml"

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parity
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test

  baseline-windows:
    needs: unit
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the fixture
        id: fixture
        run: |
          if [ -f parity/snapshots/fixture/data/matches.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The anonymized fixture is not committed yet (decision E2). Skipping the Windows baseline."
          fi

      - if: steps.fixture.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.fixture.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - if: steps.fixture.outputs.found == 'true'
        name: Build trunk Electron
        run: |
          npm ci
          npm run rebuild
          node node_modules/electron/install.js
          npm run build

      - if: steps.fixture.outputs.found == 'true'
        name: Install parity
        working-directory: parity
        run: bun install --frozen-lockfile

      - if: steps.fixture.outputs.found == 'true'
        name: Capture twice
        working-directory: parity
        env:
          LANES: ${{ inputs.lanes || 'all' }}
        run: |
          bun capture.ts --app electron --data fixture --states "$LANES" --out out/baseline/run-1
          bun capture.ts --app electron --data fixture --states "$LANES" --out out/baseline/run-2

      - if: steps.fixture.outputs.found == 'true'
        name: Compare the two runs
        working-directory: parity
        run: bun determinism.ts out/baseline/run-1 out/baseline/run-2 | tee out/baseline/determinism.log

      - if: steps.fixture.outputs.found == 'true'
        name: Dump the tray and app menus
        working-directory: parity
        run: bun menus.ts --app electron --data fixture --out out/baseline/menus

      - if: always() && steps.fixture.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parity-baseline-windows
          path: parity/out/baseline
