name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci

      # Before the slow steps, so a release that would not compile fails in
      # under a minute rather than after packaging
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - run: npm run dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BetterMayhemTracker.exe \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # Runs once the Windows job has created the release, and attaches the mac
  # builds to it. better-sqlite3 ships prebuilt darwin binaries for both
  # architectures, so one Apple silicon runner builds arm64 and x64 alike.
  release-mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run dist:mac

      - name: Upload mac builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/BetterMayhemTracker-mac-arm64.dmg \
            dist/BetterMayhemTracker-mac-x64.dmg \
            dist/BetterMayhemTracker-mac-arm64.zip \
            dist/BetterMayhemTracker-mac-x64.zip
