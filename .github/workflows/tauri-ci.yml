name: Tauri CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Rust format
        working-directory: tauri/src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: tauri/src-tauri
        run: cargo test

      - name: Build
        run: bun run tauri build --debug

      # The size is not asserted: a runner's display is smaller than 1280 by 820,
      # so the OS shrinks the window. The title is read back from the window.
      - name: Launch the debug build and read its window
        run: |
          exe=src-tauri/target/debug/better-mayhem-tracker-tauri
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          "$exe" > window.log 2>&1 &
          pid=$!
          sleep 10
          alive=0
          if kill -0 "$pid"; then alive=1; fi
          if [ "$alive" -eq 1 ]; then kill "$pid"; fi
          cat window.log
          test "$alive" -eq 1
          grep -F ' title="Better Mayhem Tracker" ' window.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: tauri/window.log
          if-no-files-found: ignore
