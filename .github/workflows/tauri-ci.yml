name: Tauri CI

# The Tauri workspace on both platforms the app ships for: lint, format,
# typecheck and tests, the Rust checks, then a debug build of the app.
on:
  push:
    branches: ["**"]
    paths:
      - "tauri/**"
      - ".github/workflows/tauri-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      # The Tauri toolchain runs on bun's newest canary, the same one used locally
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Rust format
        working-directory: tauri/src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: tauri/src-tauri
        run: cargo test

      - name: Build
        run: bun run tauri build --debug

      - name: Launch the debug build and read its window
        run: |
          exe=src-tauri/target/debug/better-mayhem-tracker-tauri
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          "$exe" > window.log 2>&1 &
          pid=$!
          sleep 10
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; fi
          kill "$pid" 2>/dev/null || true
          cat window.log
          test "$alive" -eq 1
          grep -F 'size=1280x820 min=900x600 background=#0a1024' window.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: tauri/window.log
          if-no-files-found: ignore
