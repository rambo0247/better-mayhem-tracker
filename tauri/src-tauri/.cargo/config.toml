[env]
# The bundled SQLite gets the better-sqlite3 13.0.3 compile options that
# rusqlite's bundled build lacks (node_modules/better-sqlite3/deps/defines.gypi),
# so SQL behaves as it does in Electron. The T11 record says why each of the
# others is left out, and db_compat.rs checks PRAGMA compile_options against
# Electron's.
LIBSQLITE3_FLAGS = """\
  SQLITE_DQS=0 \
  SQLITE_LIKE_DOESNT_MATCH_BLOBS \
  SQLITE_ENABLE_MATH_FUNCTIONS \
  SQLITE_ENABLE_PERCENTILE \
  SQLITE_ENABLE_GEOPOLY \
  SQLITE_ENABLE_FTS4 \
  SQLITE_DEFAULT_CACHE_SIZE=-16000 \
  SQLITE_DEFAULT_MEMSTATUS=0 \
  SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 \
  SQLITE_OMIT_DEPRECATED \
  SQLITE_OMIT_PROGRESS_CALLBACK \
  SQLITE_OMIT_SHARED_CACHE \
  SQLITE_OMIT_TCL_VARIABLE \
  SQLITE_TRACE_SIZE_LIMIT=32 \
"""
