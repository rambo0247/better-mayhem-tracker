[package]
name = "better-mayhem-tracker-tauri"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "better-mayhem-tracker-tauri"

[lib]
name = "bmt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
# The in-process driver the parity tools use. Debug builds only: a release
# build with it fails to compile (parity_driver.rs).
parity-driver = ["parity-ca"]
# The parity fake League client's CA as a second anchor, and League discovery
# limited to the folders the parity tools name. Debug builds only (lcu/tls.rs).
parity-ca = []
# The binary that writes ../src/bindings.ts. Gated so `tauri build` never
# compiles it into the bundle.
export-bindings = []

[[bin]]
name = "better-mayhem-tracker-tauri"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["export-bindings"]

[[test]]
name = "golden"
path = "tests/golden.rs"
# Prints the channel table straight to the terminal; libtest would capture it
harness = false
# Replay freezes the clock, and only test and driver builds have a frozen one
required-features = ["parity-driver"]

[[test]]
name = "score_golden"
path = "tests/score_golden.rs"
# Prints the match counts straight to the terminal, as golden.rs does
harness = false

[build-dependencies]
serde_json = "=1.0.154"
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
# devtools: F12 opens them in every build, as Electron's do
tauri = { version = "=3.0.0-alpha.6", features = ["devtools", "image-png", "tray-icon"] }
tauri-runtime-wry = { version = "=3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-dialog = "=3.0.0-alpha.4"
tokio = { version = "=1.54.1", features = ["fs", "macros", "net", "process", "rt", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
# preserve_order, so a payload stringifies with its keys where JSON.parse left
# them. float_roundtrip, because the default float parser is not correctly
# rounded and lands one ULP off JSON.parse on a few percent of literals.
ts-rs = "=12.0.1"
heck = "=0.5.0"
rusqlite = { version = "=0.43.0", features = ["backup", "bundled"] }
sha1_smol = { version = "=1.0.1", optional = true }
# ICU root collation, because String.prototype.localeCompare is ICU's and a hand-written table misorders every non-ASCII name
# unstable for CollatorBorrowed::new_root, the root-only collator
icu_collator = { version = "=2.3.1", features = ["unstable"] }
icu_decimal = "=2.3.0"
icu_locale_core = "=2.3.0"
# zlib-rs, because miniz_oxide writes different deflate streams than zlib does
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
# Number.prototype.toString, including its round-half-even choice between
# equally short digit strings, which std's shortest formatting doesn't make
ryu-js = "=1.0.4"
jiff = "=1.0.2"
# Insertion-ordered maps and sets, as JavaScript's Map and Set iterate
indexmap = "=2.14.2"
base64 = "=0.23.1"
futures-util = "=0.3.34"
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
tokio-tungstenite = { version = "=0.30.0", features = ["__rustls-tls"] }
# Mozilla's roots, which Node's fetch trusts, for Riot's match history service
webpki-root-certs = "=1.0.12"
# zlib-rs, because miniz_oxide writes different deflate streams than zlib does
webpki-roots = "=1.0.12"

[dev-dependencies]
tauri = { version = "=3.0.0-alpha.6", features = ["test"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util"] }
# The menu's accelerator parser, which Tauri does not re-export
muda = "=0.20.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }

# Webview snapshots, for the parity driver and later for card export
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSStatusItem",
  "NSColorSpace",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFCGTypes", "CFLocale", "CFRunLoop", "CFString", "block2"] }
objc2-foundation = { version = "=0.3.2", features = [
  "NSAppleEventDescriptor",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSProcessInfo",
  "NSString",
  "NSValue",
] }
objc2-web-kit = { version = "=0.3.2", features = [
  "WKContentWorld",
  "WKFrameInfo",
  "WKSnapshotConfiguration",
  "WKWebView",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
] }

# The per-user folder that holds the single-instance lock
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-single-instance = "=3.0.0-alpha.3"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panicking command rejects its call rather than ending the app
panic = "unwind"
strip = true

# SQLite at -O3 in every build, as better-sqlite3 compiles it. At -O0 a debug
# build ran T14's queries 2.3 times slower than Electron.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3
