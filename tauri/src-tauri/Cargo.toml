[package]
name = "better-mayhem-tracker-tauri"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "better-mayhem-tracker-tauri"

[lib]
name = "bmt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
# The in-process driver the parity tools use. Debug builds only: a release
# build with it fails to compile (parity_driver.rs).
parity-driver = ["dep:sha1_smol"]
# The binary that writes ../src/bindings.ts. Gated so `tauri build` never
# compiles it into the bundle.
export-bindings = []

[[bin]]
name = "better-mayhem-tracker-tauri"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["export-bindings"]

[[test]]
name = "golden"
path = "tests/golden.rs"
# Prints the channel table straight to the terminal; libtest would capture it
harness = false
# Replay freezes the clock, and only test and driver builds have a frozen one
required-features = ["parity-driver"]

[build-dependencies]
serde_json = "=1.0.154"
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = { version = "=3.0.0-alpha.6" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
ts-rs = "=12.0.1"
heck = "=0.5.0"
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
sha1_smol = { version = "=1.0.1", optional = true }
dirs = "=7.0.0"
tauri-plugin-opener = { version = "=3.0.0-alpha.3", default-features = false }
jiff = "=1.0.2"
url = "=2.5.9"

[dev-dependencies]
tauri = { version = "=3.0.0-alpha.6", features = ["test"] }
sha2 = "=0.10.9"

# Webview snapshots, for the parity driver and later for card export
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSBitmapImageRep",
  "NSColorSpace",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFCGTypes", "CFLocale", "CFString"] }
objc2-foundation = { version = "=0.3.2", features = [
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSProcessInfo",
  "NSString",
  "NSValue",
] }
objc2-web-kit = { version = "=0.3.2", features = [
  "WKContentWorld",
  "WKFrameInfo",
  "WKSnapshotConfiguration",
  "WKWebView",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
] }
base64 = "=0.23.1"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panicking command rejects its call rather than ending the app
panic = "unwind"
strip = true
